upstream axlmc_website {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name axlmc.org www.axlmc.org;

    location / {
        return 301 https://axlmc.org$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.axlmc.org;

    ssl_certificate /etc/letsencrypt/live/axlmc.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/axlmc.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://axlmc.org$request_uri;
}

server {
    listen 443 ssl;
    server_name axlmc.org;

    ssl_certificate /etc/letsencrypt/live/axlmc.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/axlmc.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /www/wwwroot/axlmc.org/current/public;
    index index.html;
    charset utf-8;
    autoindex off;
    open_file_cache off;

    client_max_body_size 512m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/javascript application/javascript
               application/json application/xml image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hashed build assets are shared across releases so pages opened before a
    # deploy keep working while the symlink switches.
    location ^~ /_nuxt/ {
        root /www/wwwroot/axlmc.org/shared;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ^~ /launcher-demo/ {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache" always;
    }

    location ~ (^|/)\. {
        return 404;
    }

    # Prerendered support checkout metadata stays static; everything else under
    # /api/ is handled by Nitro.
    location ^~ /api/support/checkout/ {
        default_type application/json;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300" always;
    }

    location ^~ /api/ {
        proxy_pass http://axlmc_website;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Nuxt Studio and its auth callbacks need a live Nitro server. Keep them out
    # of search indexes.
    # Match /_studio and /_studio/… but not the static /_studio-app/ assets.
    location ~ ^/_studio(?:/|$) {
        proxy_pass http://axlmc_website;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ^~ /__nuxt_studio/ {
        proxy_pass http://axlmc_website;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        try_files $uri $uri/index.html @nuxt;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location @nuxt {
        proxy_pass http://axlmc_website;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
