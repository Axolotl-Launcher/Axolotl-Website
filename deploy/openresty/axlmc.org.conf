server {
    listen 80;
    listen [::]:80;
    server_name axlmc.org www.axlmc.org;

    location / {
        return 301 https://axlmc.org$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.axlmc.org;

    ssl_certificate /etc/letsencrypt/live/axlmc.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/axlmc.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://axlmc.org$request_uri;
}

server {
    listen 443 ssl;
    server_name axlmc.org;

    ssl_certificate /etc/letsencrypt/live/axlmc.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/axlmc.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /www/wwwroot/axlmc.org/current;
    index index.html;
    charset utf-8;
    autoindex off;
    open_file_cache off;

    client_max_body_size 512m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/javascript application/javascript
               application/json application/xml image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ^~ /_nuxt/ {
        root /www/wwwroot/axlmc.org/shared;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ^~ /launcher-demo/ {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache" always;
    }

    location ~ (^|/)\. {
        return 404;
    }

    location / {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache" always;
    }
}
