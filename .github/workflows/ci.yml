name: Website CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: website-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Lint and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint website
        run: pnpm lint
      - name: Test website
        run: pnpm test
      - name: Check agents
        run: pnpm check-agents
      - name: Check synchronized release data
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import fs from 'node:fs'
          const catalog = JSON.parse(fs.readFileSync('releases/catalog.json', 'utf8'))
          assert(Array.isArray(catalog.announcements) && catalog.announcements.length > 0, 'Empty release catalog')
          for (const entry of catalog.announcements) {
            assert(typeof entry.version === 'string' && entry.version, `Catalog entry ${entry.id} has no version`)
          }
          const latest = JSON.parse(fs.readFileSync('releases/latest.json', 'utf8'))
          assert(/^v\d+\.\d+\.\d+$/.test(latest.tag_name), `Unexpected stable tag ${latest.tag_name}`)
          assert(Array.isArray(latest.assets) && latest.assets.length > 0, 'Latest release lists no assets')
          NODE

  build:
    name: Build website (${{ matrix.nitro-preset }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        nitro-preset: [static, cloudflare-module]
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build website
        env:
          NITRO_PRESET: ${{ matrix.nitro-preset }}
        run: pnpm build

  typos:
    name: Run typos checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Run typos checks
        uses: crate-ci/typos@6ac2ebd1b93eade61faf7e12688ad87a073fea59 # v1.46.0
